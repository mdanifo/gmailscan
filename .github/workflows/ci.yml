# The consumers (amazon-ledger, open-job-aggregator, virtual-closet) all run CI;
# the library they share did not, so nothing stood between a red commit and a
# tag they would pin. This is that something.
#
# Three interpreters, each for a reason: 3.10 is the requires-python floor,
# 3.12 is what the consumer images run (python:3.12-slim), and 3.14 is what the
# development box runs since its Ubuntu 26.04 upgrade. The suite fakes the
# Gmail API throughout and needs no credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch supersedes the run already going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest -q --cov --cov-report=term-missing
