# 3.10 is the requires-python floor, 3.12 is what the consumer images run and
# 3.14 is the development box. The suite needs no network or credentials.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch supersedes the run already going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest -q --cov --cov-report=term-missing
